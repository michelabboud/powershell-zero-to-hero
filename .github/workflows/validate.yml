name: validate

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12.13'
  POWERSHELL_VERSION: '7.6.4'
  PESTER_VERSION: '6.0.1'
  ACTIONLINT_VERSION: '1.7.12'
  PANDOC_VERSION: '3.10.1'
  TYPST_VERSION: '0.15.1'
  LIBERTINUS_VERSION: '7.051'
  POPPLER_UTILS_VERSION: '24.02.0-1ubuntu9.9'
  POWERSHELL_SHA256: '4471b5a36bfe86ec7af8525d36bb1cacba0128e7aac22d05cc064bc00e604721'
  ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
  PANDOC_SHA256: '72948bf5784f560d5ad1876709daca27e0667f262da727bb33f77b58e52df2f5'
  TYPST_SHA256: 'a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c'
  LIBERTINUS_SHA256: '4d9be29b5cb380c35af8ba967abcc752ad1e07be1f738a9789c33e0dd7478c92'

jobs:
  repository:
    name: repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify the exact Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import platform

          expected = os.environ['PYTHON_VERSION']
          actual = platform.python_version()
          if actual != expected:
              raise SystemExit(f'expected Python {expected}, found {actual}')
          print(f'Python {actual}')
          PY

      - name: Restore the exact document toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.tool_cache }}/pandoc/3.10.1
            ${{ runner.tool_cache }}/typst/0.15.1
            ${{ runner.tool_cache }}/libertinus/7.051
          key: book-tools-${{ runner.os }}-${{ runner.arch }}-pandoc-3.10.1-typst-0.15.1-libertinus-7.051

      - name: Install Pandoc, Typst, and Libertinus from official releases
        shell: bash
        run: |
          set -euo pipefail

          pandoc_root="$RUNNER_TOOL_CACHE/pandoc/$PANDOC_VERSION"
          if [[ ! -x "$pandoc_root/bin/pandoc" ]]; then
            pandoc_archive="$RUNNER_TEMP/pandoc.tar.gz"
            mkdir -p "$pandoc_root"
            curl --fail --location --silent --show-error \
              --output "$pandoc_archive" \
              "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
            printf '%s  %s\n' "$PANDOC_SHA256" "$pandoc_archive" | sha256sum --check
            tar --extract --gzip --file "$pandoc_archive" --strip-components=1 --directory "$pandoc_root"
          fi

          typst_root="$RUNNER_TOOL_CACHE/typst/$TYPST_VERSION"
          if [[ ! -x "$typst_root/typst" ]]; then
            typst_archive="$RUNNER_TEMP/typst.tar.xz"
            mkdir -p "$typst_root"
            curl --fail --location --silent --show-error \
              --output "$typst_archive" \
              "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
            printf '%s  %s\n' "$TYPST_SHA256" "$typst_archive" | sha256sum --check
            tar --extract --xz --file "$typst_archive" --strip-components=1 --directory "$typst_root"
          fi

          libertinus_root="$RUNNER_TOOL_CACHE/libertinus/$LIBERTINUS_VERSION"
          font_path="$libertinus_root/Libertinus-${LIBERTINUS_VERSION}/static/OTF"
          if [[ ! -f "$font_path/LibertinusSerif-Regular.otf" ]]; then
            libertinus_archive="$RUNNER_TEMP/libertinus.zip"
            mkdir -p "$libertinus_root"
            curl --fail --location --silent --show-error \
              --output "$libertinus_archive" \
              "https://github.com/alerque/libertinus/releases/download/v${LIBERTINUS_VERSION}/Libertinus-${LIBERTINUS_VERSION}.zip"
            printf '%s  %s\n' "$LIBERTINUS_SHA256" "$libertinus_archive" | sha256sum --check
            unzip -q "$libertinus_archive" -d "$libertinus_root"
          fi

          printf '%s\n' "$pandoc_root/bin" "$typst_root" >> "$GITHUB_PATH"
          printf 'TYPST_FONT_PATHS=%s\n' "$font_path" >> "$GITHUB_ENV"

      - name: Verify exact document tools and required font
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(pandoc --version | head -n 1)" == "pandoc $PANDOC_VERSION" ]]
          [[ "$(typst --version)" == "typst $TYPST_VERSION"* ]]
          typst fonts | grep --fixed-strings --line-regexp 'Libertinus Serif'

      - name: Install actionlint from its official release
        shell: bash
        run: |
          set -euo pipefail
          actionlint_root="$RUNNER_TOOL_CACHE/actionlint/$ACTIONLINT_VERSION"
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          mkdir -p "$actionlint_root"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$actionlint_root" actionlint
          chmod +x "$actionlint_root/actionlint"
          "$actionlint_root/actionlint" -version
          printf '%s\n' "$actionlint_root" >> "$GITHUB_PATH"

      - name: Install exact PDF inspection utilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install \
            --yes \
            --no-install-recommends \
            "poppler-utils=$POPPLER_UTILS_VERSION"
          actual_version="$(dpkg-query -W -f='${Version}' poppler-utils)"
          [[ "$actual_version" == "$POPPLER_UTILS_VERSION" ]]
          pdfinfo -v
          pdftotext -v

      - name: Run repository contracts and validation
        shell: bash
        run: |
          set -euo pipefail
          actionlint
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/validate_repository.py

  pester:
    name: pester
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore the exact PowerShell and Pester toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.tool_cache }}/powershell/7.6.4
            ${{ runner.tool_cache }}/pester/6.0.1
          key: powershell-${{ runner.os }}-${{ runner.arch }}-7.6.4-pester-6.0.1

      - name: Install PowerShell from its official release
        shell: bash
        run: |
          set -euo pipefail
          powershell_root="$RUNNER_TOOL_CACHE/powershell/$POWERSHELL_VERSION"
          if [[ ! -x "$powershell_root/pwsh" ]]; then
            archive="$RUNNER_TEMP/powershell.tar.gz"
            mkdir -p "$powershell_root"
            curl --fail --location --silent --show-error \
              --output "$archive" \
              "https://github.com/PowerShell/PowerShell/releases/download/v${POWERSHELL_VERSION}/powershell-${POWERSHELL_VERSION}-linux-x64.tar.gz"
            printf '%s  %s\n' "$POWERSHELL_SHA256" "$archive" | sha256sum --check
            tar --extract --gzip --file "$archive" --directory "$powershell_root"
            chmod +x "$powershell_root/pwsh"
          fi
          printf '%s\n' "$powershell_root" >> "$GITHUB_PATH"

      - name: Install and verify the exact Pester release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actualPowerShell = $PSVersionTable.PSVersion.ToString()
          if ($actualPowerShell -ne $env:POWERSHELL_VERSION) {
              throw "Expected PowerShell $env:POWERSHELL_VERSION, found $actualPowerShell"
          }

          $pesterRoot = Join-Path $env:RUNNER_TOOL_CACHE "pester/$env:PESTER_VERSION"
          $versionedModule = Join-Path $pesterRoot "Pester/$env:PESTER_VERSION"
          if (-not (Test-Path -LiteralPath $versionedModule -PathType Container)) {
              New-Item -Path $pesterRoot -ItemType Directory -Force | Out-Null
              Save-PSResource -Name Pester -Version $env:PESTER_VERSION `
                  -Repository PSGallery -Path $pesterRoot -TrustRepository `
                  -AcceptLicense -Quiet
          }
          $env:PSModulePath = $pesterRoot + [IO.Path]::PathSeparator + $env:PSModulePath
          $pester = Get-Module -ListAvailable -Name Pester |
              Where-Object Version -EQ ([version]$env:PESTER_VERSION) |
              Select-Object -First 1
          if ($null -eq $pester) {
              throw "Pester $env:PESTER_VERSION was not found under the verified tool cache"
          }
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION -Force
          $actualPester = (Get-Module Pester).Version.ToString()
          if ($actualPester -ne $env:PESTER_VERSION) {
              throw "Expected Pester $env:PESTER_VERSION, found $actualPester"
          }
          "PowerShell $actualPowerShell; Pester $actualPester"

      - name: Run all answer tests
        shell: pwsh
        run: ./tests/Run-AllTests.ps1
